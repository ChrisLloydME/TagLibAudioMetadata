name: CI

on:
  push:
    paths-ignore:
      # These changes must publish the remote XCFramework first. The publish
      # workflow dispatches CI after the release asset and checksum are ready.
      - ".github/workflows/taglib-binary-release.yml"
      - "scripts/build-taglib-xcframework.sh"
      - "scripts/taglib-binary-version.env"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Verify remote binary boundary
        run: |
          source scripts/taglib-binary-version.env
          test ! -d Vendor/TagLibBinaryPackage
          test -z "$(git ls-files '*.xcframework/**')"
          grep -F "${TAGLIB_BINARY_RELEASE_TAG}" Package.swift
          grep -F "${TAGLIB_BINARY_ASSET_NAME}" Package.swift
          grep -E 'checksum: "[0-9a-f]{64}"' Package.swift
      - name: Clean build
        run: |
          swift package --disable-keychain --disable-netrc clean
          swift build --disable-keychain --disable-netrc
      - name: Strict warning build
        run: swift build --disable-keychain --disable-netrc -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Test
        run: swift test --disable-keychain --disable-netrc
      - name: Consumer integration
        run: |
          swift run --disable-keychain --disable-netrc --package-path IntegrationTests/Consumer TagLibAudioMetadataConsumer
          swift run --disable-keychain --disable-netrc --package-path IntegrationTests/Consumer TagLibAudioMetadataLowLevelConsumer
      - name: Dynamic link audit
        run: |
          test ! -d Sources/CTagLibBridge/taglib
          BIN_PATH=$(swift build --disable-keychain --disable-netrc --show-bin-path)
          TEST_BINARY="$BIN_PATH/TagLibAudioMetadataPackageTests.xctest/Contents/MacOS/TagLibAudioMetadataPackageTests"
          otool -L "$TEST_BINARY" | grep '@rpath/TagLib.framework/TagLib'
          test -d "$BIN_PATH/TagLib.framework"
          test -f "$BIN_PATH/TagLib.framework/Versions/A/Resources/Info.plist"
          test -L "$BIN_PATH/TagLib.framework/Versions/Current"
          test -L "$BIN_PATH/TagLib.framework/TagLib"
          test -z "$(find Sources/CTagLibBridge -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) -print -quit)"

  address-sanitizer:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Address Sanitizer
        run: swift test --disable-keychain --disable-netrc --sanitize=address

  thread-sanitizer:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Thread Sanitizer
        run: swift test --disable-keychain --disable-netrc --sanitize=thread

  minimum-platform-builds:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 13 arm64
            sdk: macosx
            triple: arm64-apple-macosx13.0
          - name: macOS 13 x86_64
            sdk: macosx
            triple: x86_64-apple-macosx13.0
          - name: iOS 16 arm64
            sdk: iphoneos
            triple: arm64-apple-ios16.0
          - name: iOS 16 Simulator arm64
            sdk: iphonesimulator
            triple: arm64-apple-ios16.0-simulator
          - name: iOS 16 Simulator x86_64
            sdk: iphonesimulator
            triple: x86_64-apple-ios16.0-simulator
    steps:
      - uses: actions/checkout@v7
      - name: Build for ${{ matrix.name }}
        run: |
          SDK_PATH=$(xcrun --sdk "${{ matrix.sdk }}" --show-sdk-path)
          swift build --disable-keychain --disable-netrc --triple "${{ matrix.triple }}" --sdk "$SDK_PATH"

  remote-tag-consumer:
    if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'taglib-binary-')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build a clean consumer from the published tag
        run: |
          CONSUMER_PATH="${RUNNER_TEMP}/TagLibAudioMetadataConsumer"
          cp -R IntegrationTests/Consumer "${CONSUMER_PATH}"
          perl -pi -e 's#\.package\(name: "TagLibAudioMetadata", path: "\.\./\.\."\)#.package(url: "https://github.com/ChrisLloydME/TagLibAudioMetadata.git", exact: "$ENV{GITHUB_REF_NAME}")#' "${CONSUMER_PATH}/Package.swift"
          test -z "$(grep -F 'path: "../.."' "${CONSUMER_PATH}/Package.swift" || true)"
          swift run --disable-keychain --disable-netrc --package-path "${CONSUMER_PATH}" TagLibAudioMetadataConsumer
