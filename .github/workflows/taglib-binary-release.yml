name: Publish TagLib binary

on:
  push:
    branches:
      - main
    tags:
      - "taglib-binary-*"
    paths:
      - ".github/workflows/taglib-binary-release.yml"
      - "scripts/build-taglib-xcframework.sh"
      - "scripts/taglib-binary-version.env"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "taglib-binary-* tag to create or publish"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: taglib-binary-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify publishing infrastructure
        run: |
          test -f scripts/taglib-binary-version.env
          test -x scripts/build-taglib-xcframework.sh
      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          xcodebuild -version
      - name: Validate release identity
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          source scripts/taglib-binary-version.env
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_RELEASE_TAG}" != "${TAGLIB_BINARY_RELEASE_TAG}" ]]; then
            echo "Expected ${TAGLIB_BINARY_RELEASE_TAG}, got ${REQUESTED_RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAGLIB_BINARY_RELEASE_TAG}" ]]; then
            echo "Expected ${TAGLIB_BINARY_RELEASE_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_COMMIT="$(git rev-parse "${TAGLIB_BINARY_RELEASE_TAG}^{commit}")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [[ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]]; then
              echo "HEAD ${HEAD_COMMIT} does not match ${TAGLIB_BINARY_RELEASE_TAG} at ${TAG_COMMIT}" >&2
              exit 1
            fi
          elif git show-ref --verify --quiet "refs/tags/${TAGLIB_BINARY_RELEASE_TAG}"; then
            if ! git merge-base --is-ancestor "${TAGLIB_BINARY_RELEASE_TAG}^{commit}" HEAD; then
              echo "Existing ${TAGLIB_BINARY_RELEASE_TAG} is not an ancestor of HEAD" >&2
              exit 1
            fi
          fi
      - name: Build release archive
        run: scripts/build-taglib-xcframework.sh --replace
      - name: Verify archive and record checksum
        run: |
          source scripts/taglib-binary-version.env
          ARCHIVE=".build/taglib-release/${TAGLIB_BINARY_ASSET_NAME}"
          test -f "$ARCHIVE"
          CHECKSUM=$(swift package compute-checksum "$ARCHIVE")
          echo "Built SwiftPM checksum: $CHECKSUM" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish project-policy immutable release asset
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/taglib-binary-version.env
          ARCHIVE=".build/taglib-release/${TAGLIB_BINARY_ASSET_NAME}"
          PUBLISHED_CHECKSUM=""
          if gh release view "$TAGLIB_BINARY_RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$TAGLIB_BINARY_RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name' | grep -Fxq "$TAGLIB_BINARY_ASSET_NAME"; then
              EXISTING_DIRECTORY=".build/taglib-existing"
              mkdir -p "$EXISTING_DIRECTORY"
              gh release download "$TAGLIB_BINARY_RELEASE_TAG" \
                --pattern "$TAGLIB_BINARY_ASSET_NAME" \
                --dir "$EXISTING_DIRECTORY"
              PUBLISHED_CHECKSUM=$(swift package compute-checksum "$EXISTING_DIRECTORY/$TAGLIB_BINARY_ASSET_NAME")
              echo "Reusing existing immutable release asset"
            else
              gh release upload "$TAGLIB_BINARY_RELEASE_TAG" "$ARCHIVE"
              PUBLISHED_CHECKSUM=$(swift package compute-checksum "$ARCHIVE")
            fi
          else
            TAG_ARGUMENTS=()
            if git show-ref --verify --quiet "refs/tags/${TAGLIB_BINARY_RELEASE_TAG}"; then
              TAG_ARGUMENTS+=(--verify-tag)
            else
              TAG_ARGUMENTS+=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAGLIB_BINARY_RELEASE_TAG" "$ARCHIVE" \
              "${TAG_ARGUMENTS[@]}" \
              --title "TagLib ${TAGLIB_VERSION} Apple dynamic XCFramework (r${TAGLIB_BINARY_REVISION})" \
              --notes "Built from unmodified TagLib ${TAGLIB_TAG} at ${TAGLIB_COMMIT}. Supports macOS 13+, iOS 16+, and iOS Simulator."
            PUBLISHED_CHECKSUM=$(swift package compute-checksum "$ARCHIVE")
          fi
          test -n "$PUBLISHED_CHECKSUM"
          echo "checksum=$PUBLISHED_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Published SwiftPM checksum: $PUBLISHED_CHECKSUM" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Point the package manifest at the published asset
        if: github.ref_type != 'tag'
        env:
          ARCHIVE_CHECKSUM: ${{ steps.publish.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/taglib-binary-version.env
          BINARY_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAGLIB_BINARY_RELEASE_TAG}/${TAGLIB_BINARY_ASSET_NAME}"
          export BINARY_URL ARCHIVE_CHECKSUM
          perl -0pi -e 's#url: "[^"]+",\n(\s+)checksum: "[0-9a-f]+"#url: "$ENV{BINARY_URL}",\n$1checksum: "$ENV{ARCHIVE_CHECKSUM}"#' Package.swift
          grep -F "url: \"${BINARY_URL}\"" Package.swift
          grep -F "checksum: \"${ARCHIVE_CHECKSUM}\"" Package.swift
          if git diff --quiet -- Package.swift; then
            echo "Package.swift already references the published artifact"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Package.swift
            git commit -m "fix(spm): point to published TagLib binary"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
