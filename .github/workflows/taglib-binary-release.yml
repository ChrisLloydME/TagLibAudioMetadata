name: Publish TagLib binary

on:
  push:
    tags:
      - "taglib-binary-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing taglib-binary-* tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          xcodebuild -version
      - name: Validate release identity
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          source scripts/taglib-binary-version.env
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${REQUESTED_RELEASE_TAG}" != "${TAGLIB_BINARY_RELEASE_TAG}" ]]; then
            echo "Expected ${TAGLIB_BINARY_RELEASE_TAG}, got ${REQUESTED_RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAGLIB_BINARY_RELEASE_TAG}" ]]; then
            echo "Expected ${TAGLIB_BINARY_RELEASE_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/${TAGLIB_BINARY_RELEASE_TAG}"
          TAG_COMMIT="$(git rev-parse "${TAGLIB_BINARY_RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]]; then
            echo "HEAD ${HEAD_COMMIT} does not match ${TAGLIB_BINARY_RELEASE_TAG} at ${TAG_COMMIT}" >&2
            exit 1
          fi
      - name: Build release archive
        run: scripts/build-taglib-xcframework.sh --replace
      - name: Verify archive and record checksum
        run: |
          source scripts/taglib-binary-version.env
          ARCHIVE=".build/taglib-release/${TAGLIB_BINARY_ASSET_NAME}"
          test -f "$ARCHIVE"
          CHECKSUM=$(swift package compute-checksum "$ARCHIVE")
          echo "SwiftPM checksum: $CHECKSUM" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish project-policy immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/taglib-binary-version.env
          ARCHIVE=".build/taglib-release/${TAGLIB_BINARY_ASSET_NAME}"
          if gh release view "$TAGLIB_BINARY_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; project policy forbids replacing a published binary asset" >&2
            exit 1
          fi
          gh release create "$TAGLIB_BINARY_RELEASE_TAG" "$ARCHIVE" \
            --verify-tag \
            --title "TagLib ${TAGLIB_VERSION} Apple dynamic XCFramework (r${TAGLIB_BINARY_REVISION})" \
            --notes "Built from unmodified TagLib ${TAGLIB_TAG} at ${TAGLIB_COMMIT}. Supports macOS 13+, iOS 16+, and iOS Simulator."
